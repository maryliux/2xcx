<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediaPipe Hand Instrument</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #111;
        color: #f5f5f5;
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 16px;
      }

      .app {
        width: min(960px, 100%);
        display: grid;
        gap: 12px;
      }

      .controls {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }

      button {
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 15px;
        font-weight: 600;
        background: #2f8cff;
        color: #fff;
        cursor: pointer;
      }

      button:disabled {
        background: #44536a;
        cursor: not-allowed;
      }

      .hint {
        color: #bfc9d7;
        font-size: 14px;
      }

      .canvas-wrap {
        position: relative;
        border: 1px solid #2c2c2c;
        border-radius: 12px;
        overflow: hidden;
        background: #000;
      }

      canvas {
        width: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <div class="controls">
        <button id="start-btn">Start Instrument</button>
        <span class="hint">
          Wrist Y controls pitch (100Hz-800Hz). Open hand = sound, closed fist =
          silence.
        </span>
      </div>
      <div class="canvas-wrap">
        <canvas id="output" width="960" height="720"></canvas>
      </div>
    </main>

    <video id="webcam" playsinline style="display: none"></video>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tone@latest/build/Tone.js"></script>

    <script>
      const MIN_FREQ = 100;
      const MAX_FREQ = 800;
      const MAX_HANDS = 2;
      const OPEN_HAND_THRESHOLD = 1.2;
      const SILENT_GAIN = 0;
      const FULL_GAIN = 0.9;

      const startButton = document.getElementById("start-btn");
      const video = document.getElementById("webcam");
      const canvas = document.getElementById("output");
      const ctx = canvas.getContext("2d");

      let camera = null;
      let running = false;
      let voices = [];

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function toFrequency(y) {
        const normalized = 1 - clamp(y, 0, 1);
        return MIN_FREQ + normalized * (MAX_FREQ - MIN_FREQ);
      }

      function distance(a, b) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        const dz = (a.z || 0) - (b.z || 0);
        return Math.hypot(dx, dy, dz);
      }

      function palmCenter(landmarks) {
        const palmIndices = [0, 5, 9, 13, 17];
        const sum = palmIndices.reduce(
          (acc, index) => {
            const point = landmarks[index];
            acc.x += point.x;
            acc.y += point.y;
            acc.z += point.z || 0;
            return acc;
          },
          { x: 0, y: 0, z: 0 }
        );

        return {
          x: sum.x / palmIndices.length,
          y: sum.y / palmIndices.length,
          z: sum.z / palmIndices.length,
        };
      }

      function isOpenHand(landmarks) {
        const center = palmCenter(landmarks);
        const tipIndices = [4, 8, 12, 16, 20];
        const avgTipDistance =
          tipIndices.reduce((acc, index) => acc + distance(landmarks[index], center), 0) /
          tipIndices.length;
        const palmWidth = Math.max(distance(landmarks[5], landmarks[17]), 0.0001);
        const openness = avgTipDistance / palmWidth;
        return openness > OPEN_HAND_THRESHOLD;
      }

      function createVoice() {
        const gain = new Tone.Gain(0).toDestination();
        const osc = new Tone.Oscillator({
          type: "sine",
          frequency: 220,
          volume: -8,
        }).connect(gain);
        osc.start();
        return { osc, gain };
      }

      function setupAudio() {
        if (voices.length) {
          return;
        }
        voices = Array.from({ length: MAX_HANDS }, () => createVoice());
      }

      function assignVoiceIndex(handedness, used) {
        const label = handedness && handedness.label ? handedness.label : "";
        const preferred = label === "Left" ? 0 : label === "Right" ? 1 : null;
        if (preferred !== null && !used.has(preferred)) {
          return preferred;
        }
        for (let i = 0; i < MAX_HANDS; i += 1) {
          if (!used.has(i)) {
            return i;
          }
        }
        return null;
      }

      function silenceUndetectedVoices(usedIndices) {
        voices.forEach((voice, index) => {
          if (!usedIndices.has(index)) {
            voice.gain.gain.rampTo(SILENT_GAIN, 0.1);
          }
        });
      }

      function onResults(results) {
        if (!results.image) {
          return;
        }

        if (canvas.width !== results.image.width || canvas.height !== results.image.height) {
          canvas.width = results.image.width;
          canvas.height = results.image.height;
        }

        ctx.save();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

        const usedVoiceIndices = new Set();
        const handsLandmarks = results.multiHandLandmarks || [];
        const handedness = results.multiHandedness || [];

        handsLandmarks.forEach((landmarks, handIndex) => {
          const voiceIndex = assignVoiceIndex(handedness[handIndex], usedVoiceIndices);
          if (voiceIndex === null) {
            return;
          }
          usedVoiceIndices.add(voiceIndex);

          const voice = voices[voiceIndex];
          const wrist = landmarks[0];
          const targetFreq = toFrequency(wrist.y);
          const volumeOn = isOpenHand(landmarks);

          voice.osc.frequency.rampTo(targetFreq, 0.05);
          voice.gain.gain.rampTo(volumeOn ? FULL_GAIN : SILENT_GAIN, 0.08);

          drawConnectors(ctx, landmarks, HAND_CONNECTIONS, {
            color: "#4ef2ff",
            lineWidth: 3,
          });
          drawLandmarks(ctx, landmarks, {
            color: "#ffb347",
            lineWidth: 1,
            radius: 3,
          });
        });

        silenceUndetectedVoices(usedVoiceIndices);
        ctx.restore();
      }

      async function start() {
        if (running) {
          return;
        }

        startButton.disabled = true;
        startButton.textContent = "Starting...";

        try {
          await Tone.start();
          setupAudio();

          const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
          });
          hands.setOptions({
            maxNumHands: MAX_HANDS,
            modelComplexity: 1,
            minDetectionConfidence: 0.65,
            minTrackingConfidence: 0.65,
          });
          hands.onResults(onResults);

          camera = new Camera(video, {
            onFrame: async () => {
              await hands.send({ image: video });
            },
            width: 960,
            height: 720,
          });

          await camera.start();
          running = true;
          startButton.textContent = "Instrument Running";
        } catch (error) {
          console.error("Failed to start instrument", error);
          startButton.disabled = false;
          startButton.textContent = "Start Instrument";
          alert("Could not start webcam/audio. Check permissions and try again.");
        }
      }

      startButton.addEventListener("click", start);
    </script>
  </body>
</html>
