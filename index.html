<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hand Halftone Instrument</title>
    <link rel="stylesheet" href="./style.css" />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
    ></script>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
    ></script>
    <script
      type="module"
      src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"
    ></script>
  </head>
  <body>
    <canvas id="main"></canvas>
    <video id="feed" playsinline></video>
    <div id="overlay">
      <button id="begin-btn" type="button">begin creating</button>
    </div>

    <script type="module">
      import { drawHalftone } from "./halftone.js";
      import { drawHands, initTracker } from "./hand-tracker.js";
      import { initAudio, updateSound } from "./sound-engine.js";

      const canvas = document.getElementById("main");
      const ctx = canvas.getContext("2d");
      const video = document.getElementById("feed");
      const overlay = document.getElementById("overlay");
      const beginButton = document.getElementById("begin-btn");

      let latestResults = null;
      let started = false;
      let hudHz = 0;
      let hudVolume = 0;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      function selectHands(results) {
        const landmarksList = results?.multiHandLandmarks || [];
        const handednessList = results?.multiHandedness || [];
        let rightHand = null;
        let leftHand = null;

        landmarksList.forEach((landmarks, index) => {
          const label = handednessList[index]?.label;
          if (label === "Right") {
            rightHand = landmarks;
          } else if (label === "Left") {
            leftHand = landmarks;
          } else if (!rightHand) {
            rightHand = landmarks;
          } else if (!leftHand) {
            leftHand = landmarks;
          }
        });

        return { rightHand, leftHand };
      }

      async function begin() {
        if (started) {
          return;
        }

        beginButton.disabled = true;
        beginButton.textContent = "starting...";

        try {
          await globalThis.Tone.start();
          await initAudio();

          const stream = await navigator.mediaDevices.getUserMedia({ video: true });
          video.srcObject = stream;
          await video.play();

          await initTracker(video, (results) => {
            latestResults = results;
          });

          started = true;
          overlay.style.display = "none";
        } catch (error) {
          console.error("Failed to start instrument:", error);
          beginButton.disabled = false;
          beginButton.textContent = "camera/audio blocked";
        }
      }

      function drawHud() {
        ctx.save();
        ctx.fillStyle = "#ffffff";
        ctx.font = "13px monospace";
        ctx.textBaseline = "top";
        ctx.fillText(`Hz: ${hudHz.toFixed(1)}`, 12, 12);
        ctx.fillText(`Volume: ${(hudVolume * 100).toFixed(0)}%`, 12, 30);
        ctx.restore();
      }

      function frame() {
        const w = canvas.width;
        const h = canvas.height;

        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = "#050a14";
        ctx.fillRect(0, 0, w, h);

        if (video.readyState >= 2) {
          drawHalftone(ctx, video, w, h);
        }

        if (latestResults) {
          drawHands(ctx, latestResults, w, h);
        }

        const { rightHand, leftHand } = selectHands(latestResults);
        const metrics = updateSound(rightHand, leftHand);
        hudHz = metrics.hz;
        hudVolume = metrics.volume;
        drawHud();

        requestAnimationFrame(frame);
      }

      resize();
      window.addEventListener("resize", resize);
      beginButton.addEventListener("click", begin);
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
