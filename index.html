<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hand Halftone Instrument</title>
    <link rel="stylesheet" href="./style.css" />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
    ></script>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
    ></script>
    <script
      type="module"
      src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"
    ></script>
  </head>
  <body>
    <canvas id="main"></canvas>
    <video id="feed" playsinline></video>
    <div id="overlay">
      <div id="overlay-card">
        <p id="overlay-eyebrow">interactive hand instrument</p>
        <button id="begin-btn" type="button">begin creating</button>
        <p id="overlay-note">webcam + audio access required</p>
      </div>
    </div>

    <script type="module">
      import { drawHalftone } from "./halftone.js";
      import { drawHands, initTracker } from "./hand-tracker.js";
      import { initAudio, updateSound } from "./sound-engine.js";

      const canvas = document.getElementById("main");
      const ctx = canvas.getContext("2d");
      const video = document.getElementById("feed");
      const overlay = document.getElementById("overlay");
      const beginButton = document.getElementById("begin-btn");

      let latestResults = null;
      let started = false;
      let hudHz = 0;
      let hudVolume = 0;
      let previousHudVolume = 0;
      let hudHands = 0;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      function selectHands(results) {
        const landmarksList = results?.multiHandLandmarks || [];
        const handednessList = results?.multiHandedness || [];
        let rightHand = null;
        let leftHand = null;

        landmarksList.forEach((landmarks, index) => {
          const label = handednessList[index]?.label;
          if (label === "Right") {
            rightHand = landmarks;
          } else if (label === "Left") {
            leftHand = landmarks;
          } else if (!rightHand) {
            rightHand = landmarks;
          } else if (!leftHand) {
            leftHand = landmarks;
          }
        });

        return { rightHand, leftHand };
      }

      async function begin() {
        if (started) {
          return;
        }

        beginButton.disabled = true;
        beginButton.textContent = "initializing...";

        try {
          await globalThis.Tone.start();
          await initAudio();

          const stream = await navigator.mediaDevices.getUserMedia({ video: true });
          video.srcObject = stream;
          await video.play();

          await initTracker(video, (results) => {
            latestResults = results;
          });

          started = true;
          overlay.style.display = "none";
        } catch (error) {
          console.error("Failed to start instrument:", error);
          beginButton.disabled = false;
          beginButton.textContent = "retry begin creating";
        }
      }

      function roundedRectPath(targetCtx, x, y, w, h, radius) {
        const r = Math.min(radius, w * 0.5, h * 0.5);
        targetCtx.beginPath();
        targetCtx.moveTo(x + r, y);
        targetCtx.lineTo(x + w - r, y);
        targetCtx.quadraticCurveTo(x + w, y, x + w, y + r);
        targetCtx.lineTo(x + w, y + h - r);
        targetCtx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        targetCtx.lineTo(x + r, y + h);
        targetCtx.quadraticCurveTo(x, y + h, x, y + h - r);
        targetCtx.lineTo(x, y + r);
        targetCtx.quadraticCurveTo(x, y, x + r, y);
        targetCtx.closePath();
      }

      function drawHud() {
        const volDelta = Math.abs(hudVolume - previousHudVolume);
        const volumeIsMoving = volDelta > 0.006;
        const panelX = 14;
        const panelY = 14;
        const panelW = 320;
        const panelH = 116;

        ctx.save();
        ctx.globalAlpha = 0.95;

        roundedRectPath(ctx, panelX, panelY, panelW, panelH, 18);
        ctx.fillStyle = "rgba(5, 10, 20, 0.34)";
        ctx.fill();

        roundedRectPath(ctx, panelX + 0.5, panelY + 0.5, panelW - 1, panelH - 1, 18);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.22)";
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.strokeStyle = "rgba(255, 255, 255, 0.16)";
        ctx.beginPath();
        ctx.moveTo(panelX + 12, panelY + 36);
        ctx.lineTo(panelX + panelW - 12, panelY + 36);
        ctx.moveTo(panelX + panelW / 2, panelY + 42);
        ctx.lineTo(panelX + panelW / 2, panelY + panelH - 14);
        ctx.moveTo(panelX + 12, panelY + 90);
        ctx.lineTo(panelX + panelW - 12, panelY + 90);
        ctx.stroke();

        ctx.textBaseline = "top";
        ctx.font = '500 10px "Space Grotesk", sans-serif';
        ctx.fillStyle = "rgba(255, 255, 255, 0.64)";
        ctx.fillText("HAND INSTRUMENT", panelX + 15, panelY + 13);

        ctx.fillStyle = "rgba(255, 255, 255, 0.58)";
        ctx.fillText("HZ", panelX + 16, panelY + 45);
        ctx.fillText("VOL", panelX + panelW / 2 + 10, panelY + 45);

        ctx.font = '600 30px "Space Grotesk", sans-serif';
        ctx.fillStyle = "#2fb8ff";
        ctx.fillText(hudHz.toFixed(1), panelX + 16, panelY + 54);

        ctx.fillStyle = volumeIsMoving ? "#ff5fc7" : "rgba(255, 255, 255, 0.9)";
        ctx.fillText(`${Math.round(hudVolume * 100)}%`, panelX + panelW / 2 + 10, panelY + 54);

        ctx.font = '500 10px "Space Grotesk", sans-serif';
        ctx.fillStyle = "rgba(255, 255, 255, 0.64)";
        ctx.fillText(`HANDS ${hudHands}`, panelX + 16, panelY + 96);
        ctx.fillText(
          volumeIsMoving ? "VOL ACTIVE" : hudHands > 0 ? "TRACKING" : "WAITING",
          panelX + panelW / 2 + 10,
          panelY + 96
        );

        ctx.restore();
        previousHudVolume = hudVolume;
      }

      function frame() {
        const w = canvas.width;
        const h = canvas.height;

        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = "#050a14";
        ctx.fillRect(0, 0, w, h);

        ctx.save();
        ctx.translate(w, 0);
        ctx.scale(-1, 1);

        if (video.readyState >= 2) {
          drawHalftone(ctx, video, w, h);
        }

        if (latestResults) {
          drawHands(ctx, latestResults, w, h);
        }

        ctx.restore();

        const { rightHand, leftHand } = selectHands(latestResults);
        const metrics = updateSound(rightHand, leftHand);
        hudHz = metrics.hz;
        hudVolume = metrics.volume;
        hudHands = latestResults?.multiHandLandmarks?.length || 0;
        drawHud();

        requestAnimationFrame(frame);
      }

      resize();
      window.addEventListener("resize", resize);
      beginButton.addEventListener("click", begin);
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
