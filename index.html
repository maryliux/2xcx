<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hand Halftone Instrument</title>
    <link rel="stylesheet" href="./style.css" />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
    ></script>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
    ></script>
    <script
      type="module"
      src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"
    ></script>
  </head>
  <body>
    <canvas id="main"></canvas>
    <video id="feed" playsinline></video>

    <div id="overlay">
      <div id="overlay-card">
        <p id="overlay-eyebrow">interactive hand instrument</p>
        <button id="begin-btn" type="button">begin creating</button>
        <p id="overlay-note">webcam + audio access required</p>
      </div>
    </div>

    <div id="song-indicator">
      <div id="song-controls">
        <button id="import-audio-btn" type="button">import mp3</button>
        <button id="play-toggle-btn" type="button" disabled>play</button>
      </div>
      <p id="song-title">no track loaded</p>
      <div id="song-progress-track">
        <div id="song-progress-fill"></div>
        <div id="song-progress-handle"></div>
      </div>
      <div id="song-time-row">
        <span id="song-current-time">00:00:00</span>
        <span id="song-total-time">00:00:00</span>
      </div>
      <p id="upload-status">awaiting mp3 upload</p>
      <p id="song-hint">left hand open = play, closed = pause · right fingers control synth</p>
    </div>

    <input
      id="audio-file-input"
      type="file"
      accept=".mp3,audio/mpeg,audio/mp3"
      hidden
    />

    <script type="module">
      import { drawHalftone } from "./halftone.js";
      import { drawHands, initTracker } from "./hand-tracker.js";
      import {
        formatTime,
        getAudioState,
        initAudio,
        loadAudioFile,
        seekToTime,
        setPlaybackFromGesture,
        togglePlayback,
        updateSound,
      } from "./sound-engine.js";

      const canvas = document.getElementById("main");
      const ctx = canvas.getContext("2d");
      const video = document.getElementById("feed");
      const overlay = document.getElementById("overlay");
      const beginButton = document.getElementById("begin-btn");

      const importAudioButton = document.getElementById("import-audio-btn");
      const playToggleButton = document.getElementById("play-toggle-btn");
      const audioFileInput = document.getElementById("audio-file-input");
      const songTitle = document.getElementById("song-title");
      const songHint = document.getElementById("song-hint");
      const songProgressTrack = document.getElementById("song-progress-track");
      const songProgressFill = document.getElementById("song-progress-fill");
      const songProgressHandle = document.getElementById("song-progress-handle");
      const songCurrentTime = document.getElementById("song-current-time");
      const songTotalTime = document.getElementById("song-total-time");
      const uploadStatus = document.getElementById("upload-status");

      let latestResults = null;
      let started = false;
      let hudHz = 0;
      let hudVolume = 0;
      let previousHudVolume = 0;
      let hudHands = 0;

      let selectedFileName = "";
      const uploadState = {
        mode: "idle",
        successUntilMs: 0,
      };

      const scrubState = {
        isDragging: false,
        ratio: 0,
        pointerId: null,
      };

      const leftHandGestureState = {
        playbackState: null,
        openScore: 1.1,
      };

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      function distance3D(a, b) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        const dz = (a.z || 0) - (b.z || 0);
        return Math.hypot(dx, dy, dz);
      }

      function leftHandOpenScore(hand) {
        if (!hand || !hand[0] || !hand[5] || !hand[17]) {
          return 0;
        }

        const centerIndices = [0, 5, 9, 13, 17];
        let cx = 0;
        let cy = 0;
        let cz = 0;

        centerIndices.forEach((idx) => {
          cx += hand[idx].x;
          cy += hand[idx].y;
          cz += hand[idx].z || 0;
        });

        const center = {
          x: cx / centerIndices.length,
          y: cy / centerIndices.length,
          z: cz / centerIndices.length,
        };

        const tipIndices = [4, 8, 12, 16, 20];
        const tipAverage =
          tipIndices.reduce((sum, idx) => sum + distance3D(hand[idx], center), 0) /
          tipIndices.length;

        const palmWidth = Math.max(distance3D(hand[5], hand[17]), 0.0001);
        return tipAverage / palmWidth;
      }

      function ratioFromPointerEvent(event) {
        const rect = songProgressTrack.getBoundingClientRect();
        if (rect.width <= 0) {
          return 0;
        }
        return clamp((event.clientX - rect.left) / rect.width, 0, 1);
      }

      function updateUploadStatus(nowMs) {
        if (uploadState.mode === "uploading") {
          uploadStatus.textContent = "uploading...";
          uploadStatus.style.color = "rgba(255, 255, 255, 0.82)";
          return;
        }

        if (uploadState.mode === "failed") {
          uploadStatus.textContent = "upload failed";
          uploadStatus.style.color = "#ff6b7d";
          return;
        }

        if (uploadState.mode === "success" && nowMs < uploadState.successUntilMs) {
          uploadStatus.textContent = "upload successful";
          uploadStatus.style.color = "#6fff9d";
          return;
        }

        if (selectedFileName) {
          uploadState.mode = "ready";
          uploadStatus.textContent = selectedFileName;
          uploadStatus.style.color = "rgba(255, 255, 255, 0.88)";
          return;
        }

        uploadStatus.textContent = "awaiting mp3 upload";
        uploadStatus.style.color = "rgba(255, 255, 255, 0.56)";
      }

      function updateSongIndicator(audioState) {
        const hasTrack = Boolean(audioState?.hasTrack);
        const duration = Number.isFinite(audioState?.duration) ? audioState.duration : 0;
        const currentTime = Number.isFinite(audioState?.currentTime) ? audioState.currentTime : 0;
        const baseProgress = duration > 0 ? clamp(currentTime / duration, 0, 1) : 0;
        const displayProgress = scrubState.isDragging ? scrubState.ratio : baseProgress;
        const displayCurrent = scrubState.isDragging && duration > 0 ? duration * scrubState.ratio : currentTime;

        songTitle.textContent = selectedFileName || audioState?.fileName || "no track loaded";
        songCurrentTime.textContent = formatTime(displayCurrent);
        songTotalTime.textContent = formatTime(duration);

        songProgressFill.style.width = `${displayProgress * 100}%`;
        songProgressHandle.style.left = `${displayProgress * 100}%`;

        playToggleButton.disabled = !hasTrack;
        playToggleButton.textContent = audioState?.isPlaying ? "pause" : "play";
        songHint.textContent = "left hand open = play, closed = pause · right fingers control synth";

        updateUploadStatus(performance.now());
      }

      function selectHands(results) {
        const landmarksList = results?.multiHandLandmarks || [];
        const handednessList = results?.multiHandedness || [];
        let rightHand = null;
        let leftHand = null;

        landmarksList.forEach((landmarks, index) => {
          const label = handednessList[index]?.label;
          if (label === "Right") {
            rightHand = landmarks;
          } else if (label === "Left") {
            leftHand = landmarks;
          } else if (!rightHand) {
            rightHand = landmarks;
          } else if (!leftHand) {
            leftHand = landmarks;
          }
        });

        return { rightHand, leftHand };
      }

      function handleLeftHandPlayback(leftHand) {
        if (!leftHand) {
          return;
        }

        const rawScore = leftHandOpenScore(leftHand);
        const smoothed = leftHandGestureState.openScore * 0.72 + rawScore * 0.28;
        leftHandGestureState.openScore = smoothed;

        const OPEN_THRESHOLD = 1.18;
        const CLOSE_THRESHOLD = 0.93;

        if (smoothed >= OPEN_THRESHOLD && leftHandGestureState.playbackState !== true) {
          leftHandGestureState.playbackState = true;
          setPlaybackFromGesture(true).catch((error) => {
            console.error("Left-hand play gesture failed", error);
          });
          return;
        }

        if (smoothed <= CLOSE_THRESHOLD && leftHandGestureState.playbackState !== false) {
          leftHandGestureState.playbackState = false;
          setPlaybackFromGesture(false).catch((error) => {
            console.error("Left-hand pause gesture failed", error);
          });
        }
      }

      async function begin() {
        if (started) {
          return;
        }

        beginButton.disabled = true;
        beginButton.textContent = "initializing...";

        try {
          await globalThis.Tone.start();
          await initAudio();

          await initTracker(video, (results) => {
            latestResults = results;
          });

          started = true;
          overlay.style.display = "none";
          updateSongIndicator(getAudioState());
        } catch (error) {
          console.error("Failed to start instrument:", error);
          beginButton.disabled = false;
          beginButton.textContent = "retry begin creating";
        }
      }

      function roundedRectPath(targetCtx, x, y, w, h, radius) {
        const r = Math.min(radius, w * 0.5, h * 0.5);
        targetCtx.beginPath();
        targetCtx.moveTo(x + r, y);
        targetCtx.lineTo(x + w - r, y);
        targetCtx.quadraticCurveTo(x + w, y, x + w, y + r);
        targetCtx.lineTo(x + w, y + h - r);
        targetCtx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        targetCtx.lineTo(x + r, y + h);
        targetCtx.quadraticCurveTo(x, y + h, x, y + h - r);
        targetCtx.lineTo(x, y + r);
        targetCtx.quadraticCurveTo(x, y, x + r, y);
        targetCtx.closePath();
      }

      function drawHud() {
        const volDelta = Math.abs(hudVolume - previousHudVolume);
        const volumeIsMoving = volDelta > 0.006;
        const panelX = 14;
        const panelY = 14;
        const panelW = 232;
        const panelH = 64;

        ctx.save();
        ctx.globalAlpha = 0.92;

        roundedRectPath(ctx, panelX, panelY, panelW, panelH, 16);
        ctx.fillStyle = "rgba(5, 10, 20, 0.28)";
        ctx.fill();

        roundedRectPath(ctx, panelX + 0.5, panelY + 0.5, panelW - 1, panelH - 1, 16);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.16)";
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.textBaseline = "top";
        ctx.font = '500 9px "Space Grotesk", sans-serif';
        ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
        ctx.fillText("HZ", panelX + 14, panelY + 12);
        ctx.fillText("VOL", panelX + 126, panelY + 12);

        ctx.font = '600 22px "Space Grotesk", sans-serif';
        ctx.fillStyle = "#2fb8ff";
        ctx.fillText(hudHz.toFixed(1), panelX + 14, panelY + 23);

        ctx.fillStyle = volumeIsMoving ? "#ff5fc7" : "rgba(255, 255, 255, 0.9)";
        ctx.fillText(`${Math.round(hudVolume * 100)}%`, panelX + 126, panelY + 23);

        ctx.font = '500 9px "Space Grotesk", sans-serif';
        ctx.fillStyle = "rgba(255, 255, 255, 0.48)";
        ctx.fillText(`HANDS ${hudHands}`, panelX + panelW - 70, panelY + 47);

        ctx.restore();
        previousHudVolume = hudVolume;
      }

      function frame() {
        const w = canvas.width;
        const h = canvas.height;

        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = "#050a14";
        ctx.fillRect(0, 0, w, h);

        ctx.save();
        ctx.translate(w, 0);
        ctx.scale(-1, 1);

        if (video.readyState >= 2) {
          drawHalftone(ctx, video, w, h);
        }

        if (latestResults) {
          drawHands(ctx, latestResults, w, h);
        }

        ctx.restore();

        const { rightHand, leftHand } = selectHands(latestResults);
        if (started) {
          handleLeftHandPlayback(leftHand);
        }

        const metrics = updateSound(rightHand, leftHand);
        hudHz = metrics.hz;
        hudVolume = metrics.volume;
        hudHands = latestResults?.multiHandLandmarks?.length || 0;

        drawHud();
        updateSongIndicator(metrics);

        requestAnimationFrame(frame);
      }

      importAudioButton.addEventListener("click", () => {
        if (!started) {
          beginButton.textContent = "tap begin creating first";
          return;
        }
        audioFileInput.value = "";
        audioFileInput.click();
      });

      audioFileInput.addEventListener("change", async () => {
        const file = audioFileInput.files?.[0];
        if (!file) {
          return;
        }

        selectedFileName = file.name;
        uploadState.mode = "uploading";

        importAudioButton.disabled = true;
        importAudioButton.textContent = "loading...";
        updateSongIndicator(getAudioState());

        try {
          await loadAudioFile(file);
          uploadState.mode = "success";
          uploadState.successUntilMs = performance.now() + 2000;
          updateSongIndicator(getAudioState());
        } catch (error) {
          console.error("Import failed", error);
          uploadState.mode = "failed";
          songHint.textContent = "failed to load file";
        } finally {
          importAudioButton.disabled = false;
          importAudioButton.textContent = "import mp3";
        }
      });

      playToggleButton.addEventListener("click", async () => {
        if (!started) {
          return;
        }

        try {
          await togglePlayback();
          updateSongIndicator(getAudioState());
        } catch (error) {
          console.error("Play/pause failed", error);
        }
      });

      songProgressTrack.addEventListener("pointerdown", (event) => {
        const audioState = getAudioState();
        if (!audioState.hasTrack || audioState.duration <= 0) {
          return;
        }

        scrubState.isDragging = true;
        scrubState.pointerId = event.pointerId;
        scrubState.ratio = ratioFromPointerEvent(event);
        songProgressTrack.setPointerCapture(event.pointerId);

        // Immediate jump on pointer down.
        seekToTime(scrubState.ratio * audioState.duration, { forceStart: true });
        updateSongIndicator(getAudioState());
      });

      songProgressTrack.addEventListener("pointermove", (event) => {
        if (!scrubState.isDragging || scrubState.pointerId !== event.pointerId) {
          return;
        }

        scrubState.ratio = ratioFromPointerEvent(event);
        updateSongIndicator(getAudioState());
      });

      const finishScrub = (event) => {
        if (!scrubState.isDragging) {
          return;
        }
        if (scrubState.pointerId !== null && event.pointerId !== scrubState.pointerId) {
          return;
        }

        const audioState = getAudioState();
        scrubState.ratio = ratioFromPointerEvent(event);
        scrubState.isDragging = false;

        if (scrubState.pointerId !== null) {
          try {
            songProgressTrack.releasePointerCapture(scrubState.pointerId);
          } catch {
            // Ignore capture release errors.
          }
        }
        scrubState.pointerId = null;

        if (audioState.duration > 0) {
          seekToTime(scrubState.ratio * audioState.duration, { forceStart: true });
        }
        updateSongIndicator(getAudioState());
      };

      songProgressTrack.addEventListener("pointerup", finishScrub);
      songProgressTrack.addEventListener("pointercancel", finishScrub);

      resize();
      window.addEventListener("resize", resize);
      beginButton.addEventListener("click", begin);
      updateSongIndicator(getAudioState());
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
